name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Добавляем этот шаг для предотвращения падения из-за нехватки памяти
    - name: Set up Swap Space
      uses: pierotofy/set-swap-space@v1.0
      with:
        swap-size-gb: 4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ccache liblld-14 ant g++ libjpeg-dev libwebp-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: Build APK with Buildozer
      env:
        LANG: en_US.UTF-8
        LC_ALL: en_US.UTF-8
      run: |
        yes | buildozer android debug
